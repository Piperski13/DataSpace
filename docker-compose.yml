services:
  app:
    build: .
    container_name: dataspace-app

    env_file:
      - .env

    environment:
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379

    ports:
      - "3000:3000"

    depends_on:
      - redis
      - postgres

  redis:
    image: redis:7
    container_name: dataspace-redis

  postgres:
    image: postgres:16
    container_name: dataspace-postgres

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
